name: Vikunja-image bouwen

# Bouwt Vikunja met de Nederlandse datumherkenning op GitHub zelf, voert daarbij
# Vikunja's typecontrole en tests uit en publiceert het image naar ghcr.io.
#
# Handmatig starten (Actions > Vikunja-image bouwen > Run workflow):
#   bouwt en test, en publiceert alleen als je "publiceren" aanvinkt.
# Release maken: push een tag als v2.8.0-nl.1 (Vikunja-versie, "-nl.", ons eigen nummer).
#   Dan wordt gebouwd, getest, gepubliceerd en een GitHub-release aangemaakt.

on:
  workflow_dispatch:
    inputs:
      vikunja_tag:
        description: Vikunja-versie, bijvoorbeeld v2.8.0
        required: true
        default: v2.8.0
      publiceren:
        description: Image publiceren naar ghcr.io (uit = alleen bouwen en testen)
        type: boolean
        default: false
  push:
    tags:
      - 'v*-nl.*'

permissions:
  contents: write # voor de GitHub-release
  packages: write # voor het image op ghcr.io

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Versie bepalen
        id: versie
        env:
          EVENT: ${{ github.event_name }}
          INVOER_TAG: ${{ inputs.vikunja_tag }}
          INVOER_PUBLICEREN: ${{ inputs.publiceren }}
          REF_NAME: ${{ github.ref_name }}
          EIGENAAR: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            vikunja="${REF_NAME%%-nl.*}"
            publiceren=true
          else
            vikunja="$INVOER_TAG"
            publiceren="$INVOER_PUBLICEREN"
          fi
          if ! [[ "$vikunja" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Ongeldige Vikunja-versie: $vikunja" >&2
            exit 1
          fi
          image="ghcr.io/${EIGENAAR,,}/vikunja-nl"
          tags="$image:$vikunja"
          if [ "$EVENT" = "push" ]; then
            tags="$tags,$image:$REF_NAME"
          fi
          {
            echo "vikunja=$vikunja"
            echo "publiceren=$publiceren"
            echo "image=$image"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: pnpm installeren
        run: npm install --global pnpm

      - name: Vikunja ophalen, aanpassen en controleren (typecontrole en tests)
        env:
          VIKUNJA: ${{ steps.versie.outputs.vikunja }}
        run: frontend/build.sh --tag "$VIKUNJA" --check --no-docker

      - name: Eigen tests, en blijft Vikunja's Engelse invoer ongemoeid?
        env:
          VIKUNJA: ${{ steps.versie.outputs.vikunja }}
          TZ: Europe/Amsterdam # de tests rekenen met Amsterdamse tijd; GitHub staat standaard op UTC
        run: |
          npm ci
          npm test
          node scripts/check-vikunja-english.mjs "frontend/.build/vikunja-$VIKUNJA/frontend/src/modules/quickAddMagic/quickAddMagic.test.ts"

      - name: Schone broncode klaarzetten voor het image
        env:
          VIKUNJA: ${{ steps.versie.outputs.vikunja }}
        run: |
          rm -rf frontend/.build
          frontend/build.sh --tag "$VIKUNJA" --no-docker

      - uses: docker/setup-buildx-action@v4

      - name: Inloggen bij ghcr.io
        if: steps.versie.outputs.publiceren == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bouwen (en publiceren)
        uses: docker/build-push-action@v7
        with:
          context: frontend/.build/vikunja-${{ steps.versie.outputs.vikunja }}
          platforms: linux/amd64
          build-args: |
            RELEASE_VERSION=${{ steps.versie.outputs.vikunja }}
          push: ${{ steps.versie.outputs.publiceren == 'true' }}
          tags: ${{ steps.versie.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Vikunja ${{ steps.versie.outputs.vikunja }} met Nederlandse datumherkenning
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub-release maken
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VIKUNJA: ${{ steps.versie.outputs.vikunja }}
          IMAGE: ${{ steps.versie.outputs.image }}
        run: |
          cat > notes.md <<'EOF'
          Vikunja @@VIKUNJA@@ met Nederlandse datumherkenning in het invoerveld.

          **Gebruiken:** zet in je compose-bestand

          ```yaml
          services:
            vikunja:
              image: @@IMAGE@@:@@VIKUNJA@@
          ```

          en start Vikunja opnieuw. Het image staat op ghcr.io. Is het pakket privé, log dan eerst in met
          `docker login ghcr.io` (met een token met de rechten `read:packages`).

          Bij deze bouw zijn Vikunja's typecontrole en tests uitgevoerd en geslaagd.
          **Maak een back-up van je database** voordat je van Vikunja-versie wisselt.

          **Broncode (AGPL-3.0):** Vikunja @@VIKUNJA@@
          (https://github.com/go-vikunja/vikunja/tree/@@VIKUNJA@@) plus onze wijzigingen in deze
          repository, op commit @@SHA@@.
          EOF
          sed -i "s#@@VIKUNJA@@#$VIKUNJA#g; s#@@IMAGE@@#$IMAGE#g; s#@@SHA@@#$GITHUB_SHA#g" notes.md
          gh release create "$GITHUB_REF_NAME" --title "Vikunja $VIKUNJA met Nederlandse datums ($GITHUB_REF_NAME)" --notes-file notes.md
